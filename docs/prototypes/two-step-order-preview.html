      {

   * @param {string} property

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });

  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();

      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,

            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

      }
      hostPort = nextHostPort;

    }

    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

(()=&gt;{
 const root=document.getElementById(&#x27;mmm-two-step&#x27;);

 {id:&#x27;w2&#x27;,name:&#x27;2mm² 1C 電線 黑色&#x27;,unit:&#x27;M&#x27;,vendor:&#x27;伸泰&#x27;,category:&#x27;電線電纜&#x27;,min:100,step:100},
 {id:&#x27;w3&#x27;,name:&#x27;3.5mm² 2C 電纜 黑色&#x27;,unit:&#x27;M&#x27;,vendor:&#x27;伸泰&#x27;,category:&#x27;電線電纜&#x27;,min:100,step:100},
 {id:&#x27;l1&#x27;,name:&#x27;LED E27 燈泡 75W 白光&#x27;,unit:&#x27;個&#x27;,vendor:&#x27;益詮&#x27;,category:&#x27;燈具及電源&#x27;,min:1,step:1},
 {id:&#x27;p1&#x27;,name:&#x27;防水電源供應器 65W&#x27;,unit:&#x27;個&#x27;,vendor:&#x27;益詮&#x27;,category:&#x27;燈具及電源&#x27;,min:1,step:1},
 {id:&#x27;b1&#x27;,name:&#x27;束帶 120CM&#x27;,unit:&#x27;條&#x27;,vendor:&#x27;賀冠&#x27;,category:&#x27;五金配件&#x27;,min:1,step:1},
 {id:&#x27;c1&#x27;,name:&#x27;電纜接頭保護套&#x27;,unit:&#x27;只&#x27;,vendor:&#x27;賀冠&#x27;,category:&#x27;五金配件&#x27;,min:1,step:1}
 ];
 let serial=3,step=1,editKey=null,selectedId=&#x27;&#x27;,mode=&#x27;search&#x27;,lastSource=&#x27;&#x27;,sending=false,staged=[],sourceDirty=false,lastPublished=&#x27;&#x27;;
 const defaultItems=()=&gt;[
 {key:&#x27;i1&#x27;,id:&#x27;w1&#x27;,quantity:500,remarks:&#x27;A 區路燈維修&#x27;,checked:false},
 {key:&#x27;i2&#x27;,id:&#x27;l1&#x27;,quantity:12,remarks:&#x27;&#x27;,checked:false},

 ];
 let items=defaultItems();
 const design={spacing:18,notesExpanded:false};
 const escape=value=&gt;String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
 const material=id=&gt;catalog.find(m=&gt;m.id===id);
 const fmt=value=&gt;Number(value).toLocaleString(&#x27;zh-TW&#x27;);
 function persist(){const privateContent={version:4,items,step,selectedId,editKey,mode,source:ui(&#x27;source&#x27;).value,draftName:ui(&#x27;draftName&#x27;).value,serial,staged,sourceDirty,lastSource};lastPublished=JSON.stringify(privateContent);if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:&#x27;兩步式下單・文字分析僅略過&#x27;,step,materials:items.map(i=&gt;({name:material(i.id).name,quantity:i.quantity,unit:material(i.id).unit})),analysis:{count:staged.length,skipped:staged.filter(i=&gt;!i.included).length,willAdd:staged.filter(i=&gt;i.included).length},design},privateContent}).catch(()=&gt;{});}
 function restore(saved){const s=saved?.privateContent;if(!s||JSON.stringify(s)===lastPublished||s.version!==4||!Array.isArray(s.items)||s.items.length&gt;100||!s.items.every(i=&gt;material(i.id)&amp;&amp;typeof i.key===&#x27;string&#x27;&amp;&amp;Number.isFinite(i.quantity)&amp;&amp;i.quantity&gt;0))return;items=s.items;staged=Array.isArray(s.staged)?s.staged:[];sourceDirty=Boolean(s.sourceDirty);lastSource=s.lastSource??&#x27;&#x27;;step=[1,2,3].includes(s.step)?s.step:1;selectedId=material(s.selectedId)?s.selectedId:&#x27;&#x27;;editKey=s.editKey??null;mode=s.mode===&#x27;text&#x27;?&#x27;text&#x27;:&#x27;search&#x27;;serial=Number(s.serial)||100;ui(&#x27;source&#x27;).value=s.source??ui(&#x27;source&#x27;).value;ui(&#x27;draftName&#x27;).value=s.draftName??&#x27;&#x27;;render();filterMaterials();selectMaterial(selectedId,false);}
